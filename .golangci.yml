version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - gosec
  settings:
    errcheck:
      # Ignoring these is idiomatic Go, not sloppiness: a deferred Close/
      # Rollback error carries nothing actionable once the resource is
      # already being torn down (Rollback after a successful Commit is a
      # documented no-op returning sql.ErrTxDone), and a failed write/read
      # against an HTTP response, or a deadline set on a conn already being
      # torn down, isn't worth surfacing either. errcheck's exclude list
      # needs the exact type-qualified name (concrete pointer type, or the
      # interface that explicitly declares the method - not just any
      # interface satisfied structurally), so this enumerates each type
      # rather than a single `io.Closer` entry.
      exclude-functions:
        - (*database/sql.Tx).Rollback
        - (*database/sql.DB).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.Rows).Close
        - (*os.File).Close
        - (*crypto/tls.Conn).Close
        - (*net/smtp.Client).Close
        - (net.Conn).Close
        - (net.Conn).SetDeadline
        - (net.Conn).SetReadDeadline
        - (net.Listener).Close
        # Covers Close() reached through an interface that itself embeds
        # io.Closer rather than declaring Close directly (e.g. resp.Body's
        # io.ReadCloser, multipart.File) - the concrete/directly-declared
        # cases above need their own entries; errcheck matches on the exact
        # type that explicitly declares the method, not everything that
        # structurally satisfies io.Closer.
        - (io.Closer).Close
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - io.Copy
        - io.ReadAll
    gosec:
      excludes:
        # G201/G202 (SQL string formatting/concatenation): every hit in this
        # codebase is the same safe pattern - dynamically sizing the number of
        # "?" placeholders for an IN (...) clause, with the actual values
        # still passed as bound args, never interpolated. gosec can't tell
        # that apart from real interpolation, and #nosec doesn't reliably
        # attach to the multi-line raw-string literals these queries use, so
        # this is disabled at the rule level instead of per call site.
        - G201
        - G202
        # G104 (unhandled errors) duplicates errcheck, less configurably:
        # every hit found here was already one of errcheck's own tuned
        # exclusions above (a Close/Rollback/SetDeadline on an already-
        # failing or already-torn-down path), so errcheck is the one source
        # of truth for "is this unchecked error OK" and G104 is redundant.
        - G104
  exclusions:
    rules:
      # Test fixtures deliberately build "insecure" values (fake creds in a
      # URL, a cookie missing flags, a request built from a test server's own
      # URL, an ignored Body.Close in a t.Cleanup) to exercise this app's own
      # handling of them - not real findings.
      - path: _test\.go
        linters:
          - gosec
        text: "G101|G124|G704"
      # Same reasoning, for the handful of test-fixture reads/writes on types
      # too broad to exclude everywhere (io.Reader/io.Writer): an in-process
      # httptest round trip writing or reading a fixed, correctly-sized
      # payload isn't a real unchecked-error risk.
      - path: _test\.go
        linters:
          - errcheck
